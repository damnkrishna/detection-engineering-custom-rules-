    product: windows
detection:
    selection_target:
        TargetObject|contains:
            - '\CurrentControlSet\Control\Lsa\Authentication Packages'
            - '\CurrentControlSet\Control\Lsa\Notification Packages'
            - '\CurrentControlSet\Control\Lsa\Security Packages'
            - '\CurrentControlSet\Control\Lsa\OSConfig\Security Packages'
    filter_system:
        Image|endswith:
            - '\lsass.exe'
            - '\services.exe'
    condition: selection_target and not filter_system
fields:
    - TargetObject
    - Image
    - Details
    - User
falsepositives:
    - Legitimate installation of enterprise identity and access management (IAM) software.
    - Deployment of organizational password synchronization utilities.
level: critical
tags:
    - attack.credential-access
    - attack.defense-evasion
    - attack.persistence
    - attack.t1556
    - attack.t1556.002
