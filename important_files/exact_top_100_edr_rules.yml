            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\taskeng.exe'
            - '\svchost.exe'
    selection_archive_image:
        Image|endswith:
            - '\7z.exe'
            - '\7za.exe'
