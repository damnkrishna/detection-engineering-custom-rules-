            - '\quser.exe'
            - '\query.exe'
            - '\qwinsta.exe'
        - OriginalFileName:
            - 'whoami.exe'
            - 'net.exe'
            - 'net1.exe'
            - 'ipconfig.exe'
            - 'nltest.exe'
            - 'systeminfo.exe'
    condition: selection_logon_context and selection_commands
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - IT administrators logging in remotely to troubleshoot system issues or gather host configuration metrics.
level: high
tags:
    - attack.initial-access
