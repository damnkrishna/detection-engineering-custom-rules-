title: Outbound Alternative Protocol Exfiltration via CLI (AN0367)
id: 56b8b30f-0373-41b4-987a-30d202d8088b
status: experimental
description: Detects command line tools or scripting engines initiating outbound network connections over alternative protocols such as FTP (21), SMTP (25/587), or external SMB (445).
author: Krishna Gupta
date: 2026-06-07
logsource:
    category: network_connection
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\rundll32.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    selection_ports:
        DestinationPort:
            - 21  # FTP
            - 25  # SMTP
            - 465 # SMTPS
            - 587 # SMTP Submission
            - 445 # SMB
    filter_local_smb:
        DestinationIp|startswith:
            - '10.'
            - '192.168.'
            - '172.16.'
            - '172.17.'
            - '172.18.'
            - '172.19.'
            - '172.2'
            - '172.3'
            - '127.'
            - 'fe80:'
            - '::1'
    condition: selection_process and selection_ports and not filter_local_smb
fields:
    - Image
    - CommandLine
    - User
    - LogonId
    - Initiated
    - SourceIp
    - DestinationIp
    - DestinationPort
falsepositives:
    - Administrative scripts sending automated alerts or connecting to external vendor FTP servers.
level: high
tags:
    - attack.exfiltration
    - attack.t1048
    - analytic.an0367
