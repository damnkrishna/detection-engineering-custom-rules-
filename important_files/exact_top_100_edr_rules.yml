title: Suspicious Browser Credential Store Access via CLI (AN0105-A)
id: 5101f3bb-c22d-402d-bcfe-5d5af2713990
status: experimental
description: Detects command-line operations attempting to copy, compress, or access web browser credential and cookie databases, indicating potential credential theft.
author: Krishna Gupta
date: 2026-06-12
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools_image:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\xcopy.exe'
            - '\robocopy.exe'
            - '\tar.exe'
            - '\7z.exe'
    selection_tools_original:
        OriginalFileName:
            - 'Cmd.Exe'
            - 'PowerShell.EXE'
            - 'pwsh.dll'
            - 'xcopy.exe'
            - 'robocopy.exe'
            - 'tar.exe'
            - '7z.exe'
    selection_chrome_login:
        CommandLine|contains|all:
            - '\Google\Chrome\User Data\'
            - '\Login Data'
    selection_chrome_cookies:
        CommandLine|contains|all:
            - '\Google\Chrome\User Data\'
            - '\Network\Cookies'
    selection_edge_login:
        CommandLine|contains|all:
            - '\Microsoft\Edge\User Data\'
            - '\Login Data'
    selection_edge_cookies:
        CommandLine|contains|all:
            - '\Microsoft\Edge\User Data\'
            - '\Network\Cookies'
    selection_firefox:
        CommandLine|contains:
            - '\Mozilla\Firefox\Profiles\'
    selection_files:
        CommandLine|contains:
            - 'logins.json'
            - 'key4.db'
            - 'key3.db'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: (selection_tools_image or selection_tools_original) and (selection_chrome_login or selection_chrome_cookies or selection_edge_login or selection_edge_cookies or selection_firefox or selection_files) and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Legitimate browser profile migrations or backup scripts by administrators.
    - Endpoint management tools performing user state migrations.
level: high
tags:
    - attack.credential-access
    - attack.t1555.003
    - analytic.an0105
    - detection.det0037
---

title: Suspicious SAM Registry Hive Export via CLI (AN0235-A)
id: 8fd3af7d-481b-4c18-bc40-90cd4ec03491
status: experimental
description: Detects attempts to export the SAM, SYSTEM, or SECURITY registry hives using the reg.exe command line utility, indicating potential credential dumping.
author: Krishna Gupta
date: 2026-06-12
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\reg.exe'
        - OriginalFileName: 'reg.exe'
    selection_action:
        CommandLine|contains:
            - 'save'
            - 'export'
            - 'backup'
    selection_target:
        CommandLine|contains:
            - 'HKLM\SAM'
            - 'HKLM\SYSTEM'
            - 'HKLM\SECURITY'
            - 'HKEY_LOCAL_MACHINE\SAM'
            - 'HKEY_LOCAL_MACHINE\SYSTEM'
            - 'HKEY_LOCAL_MACHINE\SECURITY'
    filter_installer:
        ParentImage|endswith:
            - '\msiexec.exe'
            - '\setup.exe'
    condition: selection_img and selection_action and selection_target and not filter_installer
fields:
    - Image
    - OriginalFileName
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - CurrentDirectory
    - User
    - LogonId
falsepositives:
    - Legitimate system backup operations or imaging tools.
    - Rare administrative troubleshooting by IT personnel.
level: high
tags:
    - attack.credential-access
    - attack.t1003.002
    - analytic.an0235
    - detection.det0085
---

title: Suspicious LSA Authentication Package Modification via Registry Set (AN0287-A)
id: 11a71609-0f54-439c-892e-1c1b63c36ec3
status: experimental
description: Detects modifications to the LSA Authentication, Notification, or Security Packages registry keys, indicating the potential installation of a malicious password filter DLL or authentication bypass.
author: Krishna Gupta
date: 2026-06-12
logsource:
